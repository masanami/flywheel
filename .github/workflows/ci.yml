name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # CI は Linux だけで回す。private リポジトリの Actions は macOS の分数を
        # 10 倍で数え、他の private リポジトリと共有の Free プランの月 2,000 分を
        # 圧迫するため（2026-10-06 オーナー決定）。macOS はローカルの make check で確かめる。
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install golangci-lint (version pinned by Makefile)
        run: |
          version="$(make -s print-golangci-lint-version)"
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" "$version"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: make check
        run: make check

      # ブラウザの E2E（web/e2e。偽の API の mock モードで画面を操作し、レイアウトを実測する）。
      # make check には入れず、ここで別の手順として流す（flywheel#464 の完了条件が CI での通過を求めるため）。
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: make e2e
        run: make e2e

      - name: Upload E2E traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: web/test-results
          if-no-files-found: ignore

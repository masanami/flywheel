name: CI

# CI は PR の push では走らせない。main への push（マージの後）と、手動の起動（workflow_dispatch）だけで走る。
# main の保護の必須チェックは置かない。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # CI は Linux だけで回す。macOS の runner は起動が遅く、実行の分数も Linux の 10 倍で数えられるため。
        # macOS はローカルの make check で確かめる。
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install golangci-lint (version pinned by Makefile)
        run: |
          version="$(make -s print-golangci-lint-version)"
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" "$version"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: make check
        run: make check

      # ブラウザの E2E（web/e2e。偽の API の mock モードで画面を操作し、レイアウトを実測する）。
      # make check には入れず、ここで別の手順として流す（flywheel#464 の完了条件が CI での通過を求めるため）。
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: make e2e
        run: make e2e

      - name: Upload E2E traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: web/test-results
          if-no-files-found: ignore

  # 関係グラフのブラウザの E2E を、本物の flywheel serve と種のストアに向けて流す（flywheel#463）。
  # make check には入れない。偽の API の E2E（make e2e）とは別の設定・別の置き場（web/e2e-real/）。
  e2e-real:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install UI dependencies
        run: make ui-install

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: make e2e-real
        run: make e2e-real
